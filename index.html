<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"

    <!-- Core meta -->
    <title>Noir Lounge – Table Reservations & Menu</title>
    <meta
      name="description"
      content="Noir Lounge is a modern café experience with seamless online table reservations, curated menus, and an elegant ambience."
    />

    <!-- Open Graph / Social -->
    <meta property="og:title" content="Noir Lounge – Reserve Your Table" />

      property="og:description"
      content="Book a table at Noir Lounge, explore the menu, and manage your reservations with a premium web experience."

      content="Noir Lounge – Reserve Your Table"

      content="https://your-domain.com/og-noir-lounge.png"
